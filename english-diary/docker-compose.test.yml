version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: langlog-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langlog_test}
      POSTGRES_USER: ${POSTGRES_USER:-langlog_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langlog_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: langlog-backend-test
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-langlog_test}:${POSTGRES_PASSWORD:-test_password}@postgres:5432/${POSTGRES_DB:-langlog_test}
      ENVIRONMENT: test
    command: >
      sh -c "
        pip install -e . &&
        python -m pytest tests/ 
          -v 
          --tb=short 
          --cov=app 
          --cov-report=html 
          --cov-report=term-missing
      "
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
