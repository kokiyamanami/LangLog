[pytest]
# テストの検出パターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 非同期テスト設定
asyncio_mode = auto

# テストカバレッジ設定
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing

# マーカー定義
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
