# ============================================
# Nginx ウェブサーバー設定
# ============================================
# 役割：React SPA 配信 + FastAPI への API プロキシ

# ============================================
# マスター設定
# ============================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ============================================
# イベント設定
# ============================================
events {
    worker_connections 1024;  # ワーカーあたりの同時接続数
    use epoll;                 # 効率的なイベント処理（Linux）
}

# ============================================
# HTTP 全体設定
# ============================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # アクセスログフォーマット
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # パフォーマンス設定
    # ============================================
    sendfile on;          # ファイル送信の効率化
    tcp_nopush on;        # TCP パケット送信最適化
    tcp_nodelay on;       # TCP 遅延なし（リアルタイム性重視）
    keepalive_timeout 65; # クライアント接続保持時間
    types_hash_max_size 2048;
    client_max_body_size 100M; # ファイルアップロード最大サイズ

    # ============================================
    # gzip 圧縮
    # ============================================
    # 目的：テキスト系ファイルの転送量削減
    gzip on;
    gzip_vary on;         # Vary ヘッダー追加（キャッシュの多様性を記録）
    gzip_proxied any;     # プロキシ配信時も圧縮
    gzip_comp_level 6;    # 圧縮レベル（1-9、デフォルト 6）
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ============================================
    # アップストリーム設定
    # ============================================
    # FastAPI コンテナへの接続先定義
    # ECS タスク内では fastapi:8000 で DNS 解決可能
    # （Nginx コンテナと同じネットワークに属しているため）
    upstream fastapi {
        server fastapi:8000;
    }

    # ============================================
    # サーバー設定
    # ============================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ============================================
        # React SPA ルーティング
        # ============================================
        # 役割：
        # - React dist/ ファイルの配信
        # - 不在の静的ファイルを index.html にフォールバック
        #   （これにより React Router がクライアント側でルーティングを処理可能）
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            # ============================================
            # HTML キャッシュ戦略
            # ============================================
            # 目的：index.html を常に最新版から取得
            # max-age=0 + must-revalidate で毎回サーバーに確認
            expires -1;
            add_header Cache-Control "public, max-age=0";
        }

        # ============================================
        # 静的ファイルキャッシュ
        # ============================================
        # 対象：JS, CSS, 画像等
        # 戦略：
        # - expires 1y：ブラウザキャッシュ 1 年
        # - immutable：ハッシュ化されたファイル名前提（変更時は URL 変更）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================
        # API プロキシ（FastAPI）
        # ============================================
        # 役割：
        # - /api/* リクエストを FastAPI へフォワード
        # - クライアント → Nginx → FastAPI → クライアント
        # 通信パス説明：
        # 1. proxy_pass で http://fastapi を指定（アップストリーム接続）
        # 2. proxy_set_header で元のリクエスト情報を転送
        # 3. FastAPI の /api エンドポイントに到達
        location /api {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            
            # ============================================
            # ヘッダー転送設定
            # ============================================
            # WebSocket 対応（Upgrade/Connection）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # クライアント情報転送（FastAPI で $client_addr 等で使用可能）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ============================================
            # タイムアウト設定
            # ============================================
            # 各段階でのタイムアウト（FastAPI 処理時間に合わせ調整可能）
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # ============================================
            # バッファリング設定
            # ============================================
            # 目的：FastAPI からのレスポンスをバッファリング
            # メリット：Nginx がバッファし、クライアントへ段階的に配信可能
            # パフォーマンス向上、バックエンド負荷軽減
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ============================================
        # FastAPI ドキュメント
        # ============================================
        # 役割：
        # - /docs → Swagger UI
        # - /redoc → ReDoc (API ドキュメント)
        # - /openapi.json → OpenAPI スキーマ
        # PoC 環境で開発時に確認可能（本番では削除推奨）
        location /docs {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /redoc {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /openapi.json {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
        }

        # ============================================
        # ヘルスチェック
        # ============================================
        # 役割：
        # - ECS タスク健全性確認用エンドポイント
        # - ロードバランサーによる定期的な確認
        # - コンテナ再起動判定に使用
        location /health {
            access_log off;                      # ヘルスチェックはログ記録しない
            return 200 "healthy\n";              # HTTP 200 で即座に応答
            add_header Content-Type text/plain;
        }
    }
}
