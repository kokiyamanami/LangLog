name: Backend Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'english-diary/backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'english-diary/backend/**'

# Note: See backend-test.yml for the main backend test workflow
# This workflow is kept for backward compatibility

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "Backend tests are now run by .github/workflows/backend-test.yml"
          echo "This workflow can be removed in the future."
