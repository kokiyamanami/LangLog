name: Lint and Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8 (critical errors only)
        run: |
          # Check for critical syntax errors only
          flake8 english-diary/backend/app --count --select=E9,F63,F7,F82 --show-source --statistics || true
        continue-on-error: true
