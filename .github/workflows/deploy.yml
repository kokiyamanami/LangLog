name: Deploy to ECS (Disabled)

on:
  workflow_dispatch:
    # 手動トリガーのみ。自動デプロイは無効化

# Note: This workflow requires AWS credentials and ECS setup
# それまでは、このワークフローは disabled です

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow disabled
        run: |
          echo "This workflow is currently disabled."
          echo "It requires AWS credentials and ECS infrastructure setup."
          exit 0
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "Image: ${{ steps.image.outputs.image }}"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
